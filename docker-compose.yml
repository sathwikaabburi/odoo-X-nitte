services:

  db:
    image: postgres:17
    container_name: dayflow_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dayflow
      POSTGRES_USER: dayflow_user
      POSTGRES_PASSWORD: dayflow_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dayflow_user -d dayflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend/database
      dockerfile: Dockerfile
    container_name: dayflow_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend/database:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/database/.env
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dayflow_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data: